<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Laboratorios</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Laboratorios</h1>
        <div class="card shadow p-4">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Id</th>
                        <th>Nombre</th>
                        <th>Ubicacion</th>
                        <th>Capacidad</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-laboratorios"></tbody>
            </table>
        </div>
    </div>
    <script>
        
        const token = localStorage.getItem('token');
        
        fetch('/api/laboratorios',{
            methods: 'GET',
            headers: { 'Authorization': 'Bearer ' + token }
        })
            .then(response => response.json())
            .then(data => {
                const tabla = document.getElementById('tabla-laboratorios');
                tabla.innerHTML = '';

                data.forEach(laboratorio => {
                    tabla.innerHTML += `
                        <tr>
                            <td>${laboratorio.id}</td>
                            <td>${laboratorio.nombre}</td>
                            <td>${laboratorio.ubicacion}</td>
                            <td>${laboratorio.capacidad}</td>
                            <td>${laboratorio.estado}</td>  
                        </tr>
                    `;
                });
            })
            .catch(error => console.error('Error:', error));

        
    
    </script>
</body>
</html>
