<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Gestión de Laboratorios</a>
        <button class="btn btn-light" onclick="cerrarSesion()">Salir</button>
    </div>
</nav>

<div class="container mt-4">
    <h3>Reservas</h3>
    <form id="formReserva" class="card card-body mb-3">
        <div class="row g-2">
            <div class="col-md-3"><select class="form-control" id="id_laboratorio" required></select></div>
            <div class="col-md-2"><input type="date" class="form-control" id="fecha" required></div>
            <div class="col-md-2"><input type="time" class="form-control" id="hora_inicio" required></div>
            <div class="col-md-2"><input type="time" class="form-control" id="hora_fin" required></div>
            <div class="col-md-2">
                <select class="form-control" id="estado">
                    <option value="pendiente">pendiente</option>
                    <option value="aprobada">aprobada</option>
                    <option value="rechazada">rechazada</option>
                </select>
            </div>
            <div class="col-md-1"><button class="btn btn-primary w-100">Guardar</button></div>
        </div>
    </form>

    <div class="card card-body mb-3">
        <h5>Buscar reservas por fecha</h5>
        <div class="row">
            <div class="col-md-4"><input type="date" id="fechaBuscar" class="form-control"></div>
            <div class="col-md-3"><button class="btn btn-success" onclick="buscarReservasPorFecha()">Buscar</button></div>
        </div>
        <div id="resultadoReservasFecha" class="mt-3"></div>
    </div>

    <table class="table table-bordered table-striped">
        <thead><tr><th>ID</th><th>Laboratorio</th><th>Usuario</th><th>Fecha</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="tablaReservas"></tbody>
    </table>
</div>
<script src="js/config.js"></script>
<script src="js/reservas.js"></script>
</body>
</html>
