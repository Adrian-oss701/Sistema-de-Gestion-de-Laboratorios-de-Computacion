<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Gestión de Laboratorios</a>
        <button class="btn btn-light" onclick="cerrarSesion()">Salir</button>
    </div>
</nav>

<div class="container mt-4">
    <h3>Equipos</h3>
    <form id="formEquipo" class="card card-body mb-3">
        <div class="row g-2">
            <div class="col-md-2"><input class="form-control" id="codigo" placeholder="Código" required></div>
            <div class="col-md-3"><input class="form-control" id="descripcion" placeholder="Descripción" required></div>
            <div class="col-md-2">
                <select class="form-control" id="estado">
                    <option value="operativo">operativo</option>
                    <option value="dañado">dañado</option>
                    <option value="mantenimiento">mantenimiento</option>
                </select>
            </div>
            <div class="col-md-3"><select class="form-control" id="id_laboratorio" required></select></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Guardar</button></div>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead><tr><th>ID</th><th>Código</th><th>Descripción</th><th>Estado</th><th>Laboratorio</th><th>Acciones</th></tr></thead>
        <tbody id="tablaEquipos"></tbody>
    </table>
</div>
<script src="js/config.js"></script>
<script src="js/equipos.js"></script>
</body>
</html>
