<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Gestión de Laboratorios</a>
        <button class="btn btn-light" onclick="cerrarSesion()">Salir</button>
    </div>
</nav>

<div class="container mt-4">
    <h3>Incidencias</h3>
    <form id="formIncidencia" class="card card-body mb-3">
        <div class="row g-2">
            <div class="col-md-3"><select class="form-control" id="id_laboratorio" required></select></div>
            <div class="col-md-3"><select class="form-control" id="id_equipo"></select></div>
            <div class="col-md-3"><input class="form-control" id="descripcion" placeholder="Descripción" required></div>
            <div class="col-md-2"><input type="date" class="form-control" id="fecha" required></div>
            <div class="col-md-1">
                <select class="form-control" id="estado">
                    <option value="pendiente">pendiente</option>
                    <option value="resuelta">resuelta</option>
                </select>
            </div>
        </div>
        <button class="btn btn-primary mt-3">Guardar</button>
    </form>

    <div class="card card-body mb-3">
        <h5>Buscar incidencias por laboratorio</h5>
        <div class="row">
            <div class="col-md-4"><input type="number" id="idLabBuscar" class="form-control" placeholder="ID laboratorio"></div>
            <div class="col-md-3"><button class="btn btn-success" onclick="buscarIncidenciasLaboratorio()">Buscar</button></div>
        </div>
        <div id="resultadoIncidenciasLab" class="mt-3"></div>
    </div>

    <table class="table table-bordered table-striped">
        <thead><tr><th>ID</th><th>Laboratorio</th><th>Equipo</th><th>Descripción</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="tablaIncidencias"></tbody>
    </table>
</div>
<script src="js/config.js"></script>
<script src="js/incidencias.js"></script>
</body>
</html>
