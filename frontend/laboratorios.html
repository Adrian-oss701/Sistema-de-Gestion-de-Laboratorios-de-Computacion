<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Gestión de Laboratorios</a>
        <button class="btn btn-light" onclick="cerrarSesion()">Salir</button>
    </div>
</nav>

<div class="container mt-4">
    <h3>Laboratorios</h3>
    <form id="formLaboratorio" class="card card-body mb-3">
        <div class="row">
            <div class="col-md-3"><input class="form-control" id="nombre" placeholder="Nombre" required></div>
            <div class="col-md-3"><input class="form-control" id="ubicacion" placeholder="Ubicación" required></div>
            <div class="col-md-2"><input type="number" class="form-control" id="capacidad" placeholder="Capacidad" required></div>
            <div class="col-md-2">
                <select class="form-control" id="estado">
                    <option value="disponible">disponible</option>
                    <option value="mantenimiento">mantenimiento</option>
                    <option value="ocupado">ocupado</option>
                </select>
            </div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Guardar</button></div>
        </div>
    </form>

    <div class="card card-body mb-3">
        <h5>Consultar disponibilidad por fecha</h5>
        <div class="row">
            <div class="col-md-4"><input type="date" id="fechaConsulta" class="form-control"></div>
            <div class="col-md-3"><button class="btn btn-success" onclick="consultarDisponibles()">Consultar</button></div>
        </div>
        <div id="resultadoDisponibles" class="mt-3"></div>
    </div>

    <table class="table table-bordered table-striped">
        <thead><tr><th>ID</th><th>Nombre</th><th>Ubicación</th><th>Capacidad</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody id="tablaLaboratorios"></tbody>
    </table>
</div>
<script src="js/config.js"></script>
<script src="js/laboratorios.js"></script>
</body>
</html>
